<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>智能知识库问答系统</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 70%;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
        }
        #answer {
            margin-top: 20px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }
        #source {
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🤖 智能知识库问答系统</h1>

    <input type="text" id="question" placeholder="输入你的问题...">
    <button onclick="ask()">提问</button>

    <div id="answer"></div>

    <script>
        async function ask() {
        const q = document.getElementById("question").value;
        const answerDiv = document.getElementById("answer");

        answerDiv.innerHTML = "思考中...";   // 先显示提示

        const resp = await fetch("/ask_stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({"question": q})
        });

        answerDiv.innerHTML = "";           // 清空提示

        const reader = resp.body.getReader();       // ① 拿到读取器
        const decoder = new TextDecoder("utf-8");   // ② 解码器（处理中文）

        while (true) {
            const {done, value} = await reader.read();   // ③ 读一块
            if (done) break;                             // 读完了，退出

            const text = decoder.decode(value, {stream: true});  // ④ 字节转文字
            answerDiv.innerHTML += text;                 // ⑤ 追加到页面
        }
    }

    </script>
</body>
</html>
